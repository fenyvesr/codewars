# GitHub Actions workflow for Microsoft C++ Code Analysis.
# This workflow runs the MSVC static analyzer on your C++ project
# and uploads the results to GitHub Code Scanning.

name: Microsoft C++ Code Analysis

# When should this workflow run?
on:
  # Run whenever code is pushed to main.
  push:
    branches: [ main ]

  # Run whenever a pull request targets main.
  pull_request:
    branches: [ main ]

  # Run once per week automatically.
  # This cron means: Monday at 00:00 UTC.
  schedule:
    - cron: "0 0 * * 1"

# Required permissions.
# Without security-events: write, GitHub cannot receive
# the uploaded SARIF/code-scanning results.
permissions:
  contents: read
  security-events: write
  actions: read

# Global environment variables.
env:
  # Separate build folder for MSVC analysis.
  # This avoids conflicts with your MinGW build folder.
  BUILD_DIR: ${{ github.workspace }}/C++/build-msvc-analysis

jobs:
  analyze:
    # Name shown in the GitHub Actions UI.
    name: Analyze with MSVC

    # MSVC is only available on Windows runners.
    runs-on: windows-latest

    # All normal run commands below are executed from the C++ folder.
    defaults:
      run:
        working-directory: C++

    steps:
      # Download your repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure the project with CMake using Visual Studio/MSVC.
      #
      # Important:
      # This is intentionally NOT using MinGW.
      # The Microsoft analyzer needs an MSVC/Visual Studio CMake build.
      - name: Configure CMake with MSVC
        run: cmake -B "${{ env.BUILD_DIR }}" -G "Visual Studio 17 2022" -A x64

      # Run Microsoft C++ Code Analysis.
      #
      # cmakeBuildDirectory:
      #   Points to the CMake build directory created above.
      #
      # ruleset:
      #   Defines which MSVC analysis rules are enabled.
      #   NativeRecommendedRules.ruleset is the standard recommended native C++ ruleset.
      #
      # id:
      #   Needed so later steps can access:
      #   steps.run-analysis.outputs.sarif
      - name: Initialize MSVC Code Analysis
        id: run-analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        with:
          cmakeBuildDirectory: ${{ env.BUILD_DIR }}
          ruleset: NativeRecommendedRules.ruleset

      # The MSVC analysis action can generate a SARIF file containing
      # multiple "runs" with the same category.
      #
      # GitHub Code Scanning no longer accepts SARIF files where multiple
      # runs have the same category, so we create a cleaned SARIF file that
      # keeps only the first run.
      #
      # This is a workaround for the upload error:
      # "The CodeQL Action does not support uploading multiple SARIF runs
      # with the same category."
      - name: Keep only first SARIF run
        shell: pwsh
        run: |
          # Path to the SARIF file generated by the MSVC analysis action.
          $sarif = "${{ steps.run-analysis.outputs.sarif }}"

          # Read the SARIF JSON file.
          $json = Get-Content $sarif -Raw | ConvertFrom-Json

          # Keep only the first run from the SARIF "runs" array.
          $json.runs = @($json.runs[0])

          # Write the cleaned SARIF file next to the original one.
          $fixed = "${{ env.BUILD_DIR }}/results-fixed.sarif"
          $json | ConvertTo-Json -Depth 100 | Set-Content $fixed

          # Store the cleaned SARIF path as an environment variable,
          # so the next GitHub Actions step can access it.
          echo "FIXED_SARIF=$fixed" >> $env:GITHUB_ENV

      # Upload the cleaned SARIF file to GitHub Code Scanning.
      #
      # Results will appear under:
      # Repository -> Security -> Code scanning alerts
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.FIXED_SARIF }}

      # Also upload the SARIF file as a downloadable workflow artifact.
      #
      # This is useful for debugging if GitHub Code Scanning does not show
      # what you expected.
      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: msvc-analysis-sarif
          path: ${{ steps.run-analysis.outputs.sarif }}
